version: 1
workspace: .
objective: ./context/GOAL.md

platforms:
  claude:
    driver: claude-code
  codex:
    driver: codex

start_on: claude

models:            # role -> platform -> model
  root:
    claude: opus
    codex: <your codex model>
  coordinator:
    claude: sonnet
    codex: <your codex model>
  worker:
    claude: haiku
    codex: <your codex model>

roles:
  root: ./roles/root.md
  coordinator: ./roles/coordinator.md
  worker: ./roles/worker.md

context:
  - ./context/PROJECT.md

coordinators:
  - id: team-a
  - id: team-b

tasks:
  - id: component-a
    coordinator: team-a
    brief: ./tasks/component-a.md
    write_scope: [src/component-a/]
  - id: component-b
    coordinator: team-b
    brief: ./tasks/component-b.md
    write_scope: [src/component-b/]

# Live per-session logs under .capo/runs/<id>/transcripts/. On by default.
# tail -f them to watch the team work.
transcripts: true

limits:
  max_workers_per_coordinator: 2
