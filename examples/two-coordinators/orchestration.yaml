version: 1
workspace: .
objective: ./context/GOAL.md

platforms:
  claude:
    driver: claude-code
  codex:
    driver: codex

start_on: claude

models:            # role -> platform -> model
  root:
    claude: opus
    codex: <your codex model>
  coordinator:
    claude: sonnet
    codex: <your codex model>
  worker:
    claude: haiku
    codex: <your codex model>

roles:
  root: ./roles/root.md
  coordinator: ./roles/coordinator.md
  worker: ./roles/worker.md

context:
  - ./context/PROJECT.md

coordinators:
  - id: team-a
  - id: team-b

tasks:
  - id: component-a
    coordinator: team-a
    brief: ./tasks/component-a.md
    write_scope: [src/component-a/]
  - id: component-b
    coordinator: team-b
    brief: ./tasks/component-b.md
    write_scope: [src/component-b/]

# Live per-session logs under .capo/runs/<id>/transcripts/. On by default.
# tail -f them to watch the team work.
# How much sessions may do on their own.
#   autonomous (default): they act. Claude runs with acceptEdits, Codex with
#     --approve-for-me, which keeps the workspace-write sandbox.
#   supervised: a dry run. Sessions read and plan but do not write. Because
#     CAPO runs headless, nobody is present to approve anything, so a
#     supervised run will stop rather than make changes.
autonomy: autonomous

transcripts: true

# How long a live session can emit zero events before CAPO marks it
# "stalled" in `capo status`, STATUS.md, and its own transcript. Purely
# informational: a stall never pauses, kills, or switches anything by
# itself -- it just makes silence visible so a person can look. Default
# shown; 5 minutes.
stall_timeout_ms: 300000

limits:
  max_workers_per_coordinator: 2
