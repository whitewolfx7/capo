name: Bug report
description: Something does not work the way the docs say it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: several things are known not to work yet and are listed
        under "What is not done" in the README. Limit detection has never met a
        real usage limit, the Claude Code adapter has never run against the real
        CLI, and an agent that asks for approval will stall. Those are tracked
        already.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
      placeholder: |
        I ran: capo run --config ./orchestration.yaml
        I expected: two coordinators to start on Claude Code
        I got: ...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >
        The most useful thing you can paste. The run log at
        `.capo/logs/<run-id>.log`, the relevant part of a transcript at
        `.capo/runs/<run-id>/transcripts/<session>.md`, or the output of
        `capo status --json`. Redact anything private first.
      render: shell

  - type: textarea
    id: doctor
    attributes:
      label: Output of capo doctor
      render: shell
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Node, and the `claude` and `codex` CLI versions if relevant.
      placeholder: node v22.11.0, claude 2.1.236, codex-cli 0.154.0
    validations:
      required: true
